// settings.gradle — tells Gradle which modules (sub-projects) belong to this build.
plugins {
    // Lets Gradle download a Java 17 JDK automatically if you don't have one installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'stream-lab'

// Experiment 1 only needs the producer. event-consumer and streams-processor
// are added here when we reach their experiments (5 and 10).
include 'event-producer'
