// Root build file: settings shared by every module.
//
// Version choices (checked for Java 17):
//   Spring Boot 3.5.16  - last 3.x patch (June 2026). Boot 3.x needs Java 17+, so 17 is fully supported.
//                         It manages compatible versions of spring-kafka 3.3.x, kafka-clients 3.9.x,
//                         JUnit 5, Mockito 5 and Testcontainers 1.21.x - so we never pin those by hand.
//   dependency-management 1.1.7 - the plugin that applies Boot's version list (the "BOM").
//   Gradle 8.11.1       - supported by Boot 3.5 (needs Gradle 7.6.4+ or 8.4+).
plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    apply plugin: 'java'

    group = 'com.jyoti.streamlab'
    version = '0.1.0'

    java {
        toolchain {
            // Compile and run with Java 17 even if a newer JDK is your default.
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat 'full'
        }
    }
}
